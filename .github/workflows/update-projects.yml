
name: Actualisation des projets Neozone Hub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  actualiser-projets:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer les cartes des projets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import html
          import urllib.request
          import urllib.parse

          username = "NeoZoneHub"
          readme_path = "README.md"
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?type=owner&sort=updated&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              repos = json.loads(response.read().decode())

          # Garder uniquement les dépôts originaux et publics.
          repos = [
              repo for repo in repos
              if not repo["fork"]
              and repo["name"].lower() != username.lower()
          ]

          repos.sort(
              key=lambda repo: repo["updated_at"],
              reverse=True
          )

          # Construire les cartes des projets.
          cards = []

          for repo in repos[:15]:
              name = html.escape(repo["name"])
              link = html.escape(repo["html_url"], quote=True)

              language = html.escape(
                  repo["language"] or "Autre"
              )

              stars = repo["stargazers_count"]

              description = html.escape(
                  repo["description"] or "Aucune description disponible."
              )

              description = description.replace("\n", " ")

              button = (
                  "https://img.shields.io/badge/"
                  "VOIR_LE_PROJET-6C3BFF?style=for-the-badge"
              )

              card = f"""
              <td width="50%" valign="top">
                <h3>◈ {name}</h3>
                <p>{description}</p>
                <p>
                  <img src="https://img.shields.io/badge/{urllib.parse.quote(language, safe='')}-087E9B?style=flat-square"
                       alt="Langage : {language}"/>
                  <img src="https://img.shields.io/badge/Étoiles-{stars}-392A86?style=flat-square"
                       alt="{stars} étoiles"/>
                </p>
                <a href="{link}">
                  <img src="{button}" alt="Voir le projet"/>
                </a>
              </td>
              """

              cards.append(card)

          if not cards:
              cards = [
                  """
                  <td colspan="2" align="center">
                    Aucun projet public disponible pour le moment.
                  </td>
                  """
              ]

          # Organiser les cartes deux par deux.
          rows = []

          for index in range(0, len(cards), 2):
              first = cards[index]
              second = (
                  cards[index + 1]
                  if index + 1 < len(cards)
                  else "<td width='50%'></td>"
              )

              rows.append(
                  f"<tr>\n{first}\n{second}\n</tr>"
              )

          project_section = (
              '<table width="100%">\n'
              + "\n".join(rows)
              + "\n</table>\n"
          )

          with open(readme_path, "r", encoding="utf-8") as file:
              content = file.read()

          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          if start not in content or end not in content:
              raise ValueError(
                  "Les marqueurs des projets sont absents du README."
              )

          before, remaining = content.split(start, 1)
          _, after = remaining.split(end, 1)

          updated = (
              before + start + "\n"
              + project_section
              + end + after
          )

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated)

          print(f"{len(cards)} cartes de projets générées.")
          PY

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (
            git commit -m "Mise à jour automatique des cartes de projets"
            git push
          )
