
name: Update Neozone Hub Projects

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update public repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          username = "NeoZoneHub"
          readme_path = "README.md"
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?type=owner&sort=updated&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              repos = json.loads(response.read().decode())

          repos = [
              repo for repo in repos
              if not repo["fork"]
              and repo["name"].lower() != username.lower()
          ]

          repos.sort(
              key=lambda repo: repo["updated_at"],
              reverse=True
          )

          rows = []

          for repo in repos[:15]:
              name = repo["name"]
              link = repo["html_url"]
              language = repo["language"] or "Other"
              stars = repo["stargazers_count"]
              description = (
                  repo["description"] or "No description provided."
              )

              description = description.replace("|", "\\|")
              description = description.replace("\n", " ")

              rows.append(
                  f"| [{name}]({link}) | {language} | "
                  f"{stars} | {description} |"
              )

          if not rows:
              rows = [
                  "| No public projects found | — | 0 | — |"
              ]

          with open(readme_path, "r", encoding="utf-8") as file:
              content = file.read()

          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          if start not in content or end not in content:
              raise ValueError("Project markers are missing from README.")

          before, remaining = content.split(start, 1)
          _, after = remaining.split(end, 1)

          new_section = (
              "\n"
              "| Project | Language | Stars | Description |\n"
              "|---|---|---:|---|\n"
              + "\n".join(rows)
              + "\n"
          )

          updated = before + start + new_section + end + after

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated)

          print(f"Updated {len(rows)} public repositories.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (
            git commit -m "chore: update public projects"
            git push
          )
