
from html import escape
from urllib.parse import quote

cartes = []

for repo in repos[:15]:
    nom = escape(repo["name"])
    lien = escape(repo["html_url"], quote=True)
    langage = escape(repo["language"] or "Autre")
    langage_url = quote(repo["language"] or "Autre", safe="")
    etoiles = repo["stargazers_count"]

    description = escape(
        repo["description"] or "Aucune description disponible."
    )

    carte = (
        '<td width="50%" valign="top">'
        '<table width="100%"><tr><td>'
        '<h3>◈ ' + nom + '</h3>'
        '<p>' + description + '</p>'
        '<p>'
        '<img src="https://img.shields.io/badge/'
        + langage_url + '-087E9B?style=flat-square" '
        'alt="' + langage + '"/> '
        '<img src="https://img.shields.io/badge/'
        + str(etoiles) + '%20%C3%A9toiles-392A86?style=flat-square" '
        'alt="' + str(etoiles) + ' étoiles"/>'
        '</p>'
        '<a href="' + lien + '">'
        '<img src="https://img.shields.io/badge/'
        'D%C3%89COUVRIR%20LE%20PROJET-6C3BFF'
        '?style=for-the-badge&logo=github&logoColor=white" '
        'alt="Découvrir le projet"/>'
        '</a>'
        '</td></tr></table>'
        '</td>'
    )

    cartes.append(carte)

if not cartes:
    cartes = [
        '<td colspan="2" align="center">'
        'Aucun projet public disponible.'
        '</td>'
    ]

lignes = []

for i in range(0, len(cartes), 2):
    gauche = cartes[i]
    droite = cartes[i + 1] if i + 1 < len(cartes) else '<td></td>'
    lignes.append('<tr>' + gauche + droite + '</tr>')

section_projets = (
    '<table width="100%">'
    + ''.join(lignes)
    + '</table>'
)
